[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardk-research"
version = "0.4.0"
description = "Frozen GuardK research implementation and experimental evidence"
requires-python = ">=3.10"
authors = [{name = "Mojtaba Jahanian"}]
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
